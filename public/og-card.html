<!doctype html>
<!--
  Sumber gambar pratinjau sosial (og-image.png). Bukan halaman untuk pengguna —
  diblokir di robots.txt. Regenerasi setelah mengubah berkas ini:

    npm run build && npm start        # di terminal lain
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --disable-gpu --hide-scrollbars --screenshot="$PWD/public/og-image.png" \
      --window-size=1200,630 http://localhost:3000/og-card.html
-->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <style>
      @font-face {
        font-family: 'Poppins';
        src: url('/fonts/poppins-600.woff2') format('woff2');
        font-weight: 600;
        font-display: block;
      }
      @font-face {
        font-family: 'Poppins';
        src: url('/fonts/poppins-400.woff2') format('woff2');
        font-weight: 400;
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #FAFAF9;
        font-family: 'Poppins', system-ui, sans-serif;
        color: #171717;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 88px;
        position: relative;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 44px;
      }
      .mark {
        width: 68px;
        height: 68px;
        border-radius: 20px;
        background: #171717;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mark svg { width: 34px; height: 34px; stroke: #fff; }
      .brand-name { font-weight: 600; font-size: 40px; letter-spacing: -0.5px; }
      h1 {
        font-weight: 600;
        font-size: 76px;
        line-height: 1.08;
        letter-spacing: -2.2px;
        max-width: 940px;
      }
      p {
        margin-top: 30px;
        font-weight: 400;
        font-size: 31px;
        line-height: 1.45;
        color: #737373;
        max-width: 880px;
      }
      .tags {
        margin-top: 50px;
        display: flex;
        gap: 14px;
      }
      .tag {
        border: 2px solid #E5E5E5;
        background: #fff;
        border-radius: 999px;
        padding: 13px 26px;
        font-size: 24px;
        font-weight: 400;
        color: #525252;
      }
      .url {
        position: absolute;
        bottom: 54px;
        right: 88px;
        font-size: 26px;
        color: #A3A3A3;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/>
          <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/>
          <path d="M12 17.5v-11"/>
        </svg>
      </span>
      <span class="brand-name">SplitBills</span>
    </div>
    <h1>Bagi tagihan dengan mudah, cepat, dan adil</h1>
    <p>Scan struk otomatis, tentukan siapa makan apa, bagikan link ke teman.</p>
    <div class="tags">
      <span class="tag">Gratis</span>
      <span class="tag">Tanpa login</span>
      <span class="tag">Tanpa instal</span>
    </div>
    <span class="url">splitbills.site</span>
  </body>
</html>
